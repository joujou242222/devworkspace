
<header class="top"><a class="brand" href="/" aria-label="Devworkspace home"><span class="lgm" aria-hidden="true"><i></i><i></i><i></i></span><span class="lgw" aria-hidden="true"><span class="d">Dev</span><span class="w">workspace</span></span></a><i class="rule" aria-hidden="true"></i></header>
<main>
  <div class="txt">
    <span class="err-tag" aria-hidden="true">Error 404 &middot; Not scheduled</span>
    <div class="big" aria-hidden="true">4<span class="o"></span>4</div>
    <h1>Page not found</h1>
    <p class="sub">Nothing is scheduled here. Go back, or pick up from somewhere else.</p>
    <div class="acts">
      <button class="btn ghost" id="back" type="button">← Go back</button>
      <a class="btn lime" id="dash" href="/workspace/dashboard">Go to dashboard</a>
      <a class="btn" id="login" href="/login">Log in</a>
    </div>
  </div>

  <div class="calwrap" aria-hidden="true">
    <div class="say" id="say">Drag me onto the calendar</div>
    <div class="cal">
      <div class="g"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="rows" id="rows">
        <div class="r"><div class="b" style="grid-column:1/4">Task</div></div>
        <div class="r"><div class="b ghost" id="gh" style="grid-column:3/7"><i class="lens"></i>This page</div></div>
        <div class="r"><div class="b" style="grid-column:5/8">File</div></div>
        <i class="today"></i>
      </div>
    </div>
    <p class="hint">Try dragging the dashed bar &middot; <b id="tries">0</b> attempts</p>
  </div>
</main>
