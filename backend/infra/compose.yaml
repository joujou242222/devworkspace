name: devworkspace-phase1
x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  init: true
  networks: [foundation]
  env_file: ../.env.local
services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local}
      POSTGRES_DB: devworkspace_v01
    volumes: [pg-data:/var/lib/postgresql]
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d devworkspace_v01']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command: [redis-server, --save, '', --appendonly, 'no', --protected-mode, 'no']
    networks: [foundation]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      [
        server,
        '-dir=/data',
        '-ip=storage',
        '-filer',
        '-s3',
        '-s3.port=9000',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    volumes:
      - s3-data:/data
      - ../.local/s3-identities.json:/etc/seaweedfs/s3.json:ro
    networks: [foundation]
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    networks: [foundation]
  api:
    <<: *app
    command: [node, apps/api/dist/main.js]
    environment:
      WORKSPACE_ROOT: /workspace
      NODE_ENV: development
      BIND_HOST: 0.0.0.0
      APP_ORIGIN: https://localhost:8443
      EXPERIMENT_AUTH_ENABLED: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/devworkspace_v01
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    <<: *app
    command:
      [
        node,
        apps/web/node_modules/next/dist/bin/next,
        start,
        apps/web,
        --hostname,
        0.0.0.0,
        --port,
        '3000',
      ]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
  worker:
    <<: *app
    command: [node, apps/worker/dist/main.js]
    environment:
      WORKSPACE_ROOT: /workspace
      NODE_ENV: development
      APP_ORIGIN: https://localhost:8443
      EXPERIMENT_AUTH_ENABLED: 'false'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
  proxy:
    <<: *app
    command: [node, scripts/proxy.mjs]
    ports: ['127.0.0.1:8443:8443']
    environment:
      PROXY_BIND_HOST: 0.0.0.0
      WORKSPACE_ROOT: /workspace
      API_INTERNAL_URL: http://api:3001
      WEB_INTERNAL_URL: http://web:3000
      S3_INTERNAL_URL: http://storage:9000
    volumes: [../.local/tls:/workspace/.local/tls:ro]
    depends_on: [api, web, storage]
networks:
  foundation:
    internal: true
volumes:
  pg-data:
  s3-data:
